version: 2
updates:
  # NuGet 依赖更新（含 CPM Directory.Packages.props）
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # 安全更新不受 schedule 限制，随时触发
    open-pull-requests-limit: 10
    # Central Package Management 自动兼容，直接更新 Directory.Packages.props
    registries:
      - nuget-org
    groups:
      microsoft-dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "minor"
          - "patch"
      microsoft-aspnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
        update-types:
          - "minor"
          - "patch"
      microsoft-efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore.*"
        update-types:
          - "minor"
          - "patch"
      mudblazor:
        patterns:
          - "MudBlazor"
      xunit:
        patterns:
          - "xunit"
          - "xunit.runner.*"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
      mailkit:
        patterns:
          - "MailKit"
          - "MimeKit"
      fido2:
        patterns:
          - "Fido2"
          - "Fido2.Models"

  # GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      all-actions:
        patterns:
          - "*"
