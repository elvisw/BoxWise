name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BoxWise.slnx

      - name: Build
        run: dotnet build BoxWise.slnx -c Release --no-restore

      - name: Test
        run: dotnet test BoxWise.slnx -c Release --no-build

  publish-linux:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/BoxWise.Server
          -c Release
          -r linux-x64
          --self-contained false
          -o publish/boxwise

      - name: Create archive
        run: tar -czf boxwise-linux-x64.tar.gz -C publish/boxwise .

      - name: Validate archive
        run: |
          test -f boxwise-linux-x64.tar.gz || { echo "Archive not found"; exit 1; }
          tar -tzf boxwise-linux-x64.tar.gz | grep -q "BoxWise.Server.dll" || { echo "Missing: BoxWise.Server.dll"; exit 1; }
          tar -tzf boxwise-linux-x64.tar.gz | grep -q "wwwroot/index.html" || { echo "Missing: wwwroot/index.html"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boxwise-linux-x64
          path: boxwise-linux-x64.tar.gz

  publish-windows:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/BoxWise.Server
          -c Release
          -r win-x64
          --self-contained false
          -o publish/boxwise

      - name: Create archive
        run: Compress-Archive -Path publish/boxwise/* -DestinationPath boxwise-win-x64.zip

      - name: Validate archive
        shell: pwsh
        run: |
          $entries = [System.IO.Compression.ZipFile]::OpenRead("boxwise-win-x64.zip").Entries
          $names = $entries | % { $_.FullName }
          if (-not ($names -match "BoxWise.Server.dll")) { Write-Error "Missing: BoxWise.Server.dll"; exit 1 }
          if (-not ($names -match "wwwroot/index.html")) { Write-Error "Missing: wwwroot/index.html"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boxwise-win-x64
          path: boxwise-win-x64.zip

  release:
    needs: [publish-linux, publish-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: boxwise-linux-x64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: boxwise-win-x64

      - name: Generate checksums
        run: |
          sha256sum boxwise-linux-x64.tar.gz > boxwise-linux-x64.tar.gz.sha256
          sha256sum boxwise-win-x64.zip > boxwise-win-x64.zip.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boxwise-linux-x64.tar.gz
            boxwise-linux-x64.tar.gz.sha256
            boxwise-win-x64.zip
            boxwise-win-x64.zip.sha256
          generate_release_notes: true
