# BoxWise fail2ban filter
# 注意：日志条目"Failed login attempt""Rate limit exceeded""2FA verification failed"
# 需在后续 Story（8-2a-2、8-4）中通过 ILogger 输出，fail2ban 才能生效。
[Definition]
failregex = ^.*Failed login attempt.*from <HOST>.*$
            ^.*Rate limit exceeded.*from <HOST>.*$
            ^.*2FA verification failed.*from <HOST>.*$
ignoreregex =
